<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel | Dulce Trigo</title>
<link rel="stylesheet" href="../css/estilos.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="inicio" data-rol="admin">
<div class="layout">
<header>
  <div class="brand"><img src="../img/logo.svg" alt="Logo" width="36"><span data-cfg="nombre">Dulce Trigo</span></div>
  <span id="saludo"></span>
  <button id="salir" class="btn-sec">Cerrar sesión</button>
</header>
<nav id="menu"></nav>
<main>
<section>
  <h1>Panel de administración</h1>
  <div class="cards">
    <article class="card"><h2 id="totProductos">0</h2><p>Productos</p></article>
    <article class="card"><h2 id="totClientes">0</h2><p>Clientes registrados</p></article>
    <article class="card"><h2 id="totPendientes">0</h2><p>Pedidos pendientes</p></article>
    <article class="card"><h2 id="totVentas">Bs 0</h2><p>Ventas (sin cancelados)</p></article>
  </div>
</section>
<section>
  <h2>Stock bajo (menos de 10)</h2>
  <div class="tabla-wrap"><table><thead><tr><th>Producto</th><th>Stock</th></tr></thead><tbody id="bajo"></tbody></table></div>
</section>
</main>
<aside>
  <h3>Horario</h3>
  <p data-cfg="horario"></p>
  <h3>Contacto</h3>
  <p><span data-cfg="direccion"></span><br>Tel: <span data-cfg="telefono"></span></p>
  <h3>Hoy se hornea</h3>
  <p data-cfg="horno"></p>
</aside>
<footer>&copy; 2026 <span data-cfg="nombre">Dulce Trigo</span></footer>
</div>
<script src="../js/script.js"></script>
</body>
</html>
