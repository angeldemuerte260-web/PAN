<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda | Dulce Trigo</title>
<link rel="stylesheet" href="../css/estilos.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="tienda" data-rol="cliente">
<div class="layout">
<header>
  <div class="brand"><img src="../img/logo.svg" alt="Logo" width="36"><span data-cfg="nombre">Dulce Trigo</span></div>
  <span id="saludo"></span>
  <button id="salir" class="btn-sec">Cerrar sesión</button>
</header>
<nav id="menu"></nav>
<main>
<section>
  <h1>Nuestros productos</h1>
  <div id="error" class="error" role="alert"></div>
  <label for="buscar">Buscar</label>
  <input id="buscar" type="search" placeholder="Ej: pan, pastel...">
  <div id="catalogo" class="catalogo"></div>
</section>
</main>
<aside>
  <h3>Horario</h3>
  <p data-cfg="horario"></p>
  <h3>Contacto</h3>
  <p><span data-cfg="direccion"></span><br>Tel: <span data-cfg="telefono"></span></p>
  <h3>Hoy se hornea</h3>
  <p data-cfg="horno"></p>
</aside>
<footer>&copy; 2026 <span data-cfg="nombre">Dulce Trigo</span></footer>
</div>
<script src="../js/script.js"></script>
</body>
</html>
