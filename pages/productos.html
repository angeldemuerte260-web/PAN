<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos | Dulce Trigo</title>
<link rel="stylesheet" href="../css/estilos.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="productos" data-rol="admin">
<div class="layout">
<header>
  <div class="brand"><img src="../img/logo.svg" alt="Logo" width="36"><span data-cfg="nombre">Dulce Trigo</span></div>
  <span id="saludo"></span>
  <button id="salir" class="btn-sec">Cerrar sesión</button>
</header>
<nav id="menu"></nav>
<main>
<section>
  <h1>Productos</h1>
  <p class="mut">Cambia el precio o el stock directamente en la tabla y pulsa Guardar.</p>
  <article class="panel">
    <form id="formProducto" novalidate>
      <div class="fila">
        <div><label for="nombre">Producto</label><input id="nombre" type="text"></div>
        <div><label for="categoria">Categoría</label><select id="categoria"><option>Pan</option><option>Pastel</option><option>Empanada</option><option>Bebida</option></select></div>
        <div><label for="precio">Precio (Bs)</label><input id="precio" type="number" step="0.01" min="0"></div>
        <div><label for="stock">Stock</label><input id="stock" type="number" min="0"></div>
      </div>
      <div id="error" class="error" role="alert"></div>
      <button type="submit">Guardar producto</button>
    </form>
  </article>
  <article class="panel">
    <div class="tabla-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio (Bs)</th><th>Stock</th><th>Acciones</th></tr></thead><tbody id="lista"></tbody></table></div>
  </article>
</section>
</main>
<aside>
  <h3>Horario</h3>
  <p data-cfg="horario"></p>
  <h3>Contacto</h3>
  <p><span data-cfg="direccion"></span><br>Tel: <span data-cfg="telefono"></span></p>
  <h3>Hoy se hornea</h3>
  <p data-cfg="horno"></p>
</aside>
<footer>&copy; 2026 <span data-cfg="nombre">Dulce Trigo</span></footer>
</div>
<script src="../js/script.js"></script>
</body>
</html>
